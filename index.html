<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ScaleReach · Clips ready</title>
  <meta name="description" content="Design exercise: the screen a creator sees when they come back to the clips ScaleReach generated from their long video.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">

  <script type="module" src="js/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="./" aria-label="ScaleReach home">
        <img class="brand__mark" src="assets/logo.svg" alt="" width="26" height="26">
        <span>ScaleReach</span>
      </a>

      <nav class="topnav" aria-label="Main">
        <a class="topnav__link" href="./" aria-current="page">Projects</a>
        <a class="topnav__link" href="#scheduler" data-action="nav-stub">Scheduler</a>
        <a class="topnav__link" href="#brand-kit" data-action="nav-stub">Brand kit</a>
      </nav>

      <div class="topbar__end">
        <button class="button" type="button" data-action="open-upload">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V6M6 11l6-6 6 6"/></svg>
          Upload video
        </button>
        <span class="avatar" role="img" aria-label="Signed in as Maya Rao">MR</span>
      </div>
    </div>
  </header>

  <div class="shell" id="shell">
    <aside class="sidebar" aria-labelledby="uploads-heading">
      <div class="sidebar__head">
        <h2 class="sidebar__heading" id="uploads-heading">Uploads</h2>
        <button class="icon-button icon-button--small" type="button" data-action="open-upload" aria-label="Upload video">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <div class="job-groups" id="job-list"></div>

      <div class="usage">
        <div class="usage__row"><span>Upload minutes</span><span class="num">418 / 600</span></div>
        <div class="usage__meter" role="progressbar" aria-label="Upload minutes left" aria-valuenow="418" aria-valuemin="0" aria-valuemax="600"><span style="width: 69.7%"></span></div>
        <button class="link-button usage__reset demo-only" type="button" data-action="reset-demo">Reset demo data</button>
      </div>
    </aside>

    <main class="main" id="main" tabindex="-1"></main>

    <aside class="detail" id="detail" aria-label="Selected clip"></aside>
  </div>

  <div class="toast-region" id="toasts" role="status" aria-live="polite"></div>

  <!-- Upload -->
  <dialog class="dialog" id="upload-dialog" aria-labelledby="upload-title">
    <form class="dialog__form" id="upload-form" novalidate>
      <header class="dialog__header">
        <h2 class="dialog__title" id="upload-title">Upload video</h2>
        <button class="icon-button" type="button" data-close aria-label="Close">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>

      <label class="dropzone">
        <input class="visually-hidden" type="file" name="file" id="upload-file" accept="video/*">
        <span class="dropzone__title">Choose a video file</span>
        <span class="dropzone__hint">MP4 or MOV, up to 3 hours</span>
        <span class="dropzone__file num" id="upload-file-name" hidden></span>
      </label>

      <fieldset class="samples">
        <legend class="samples__legend">Or use a sample file</legend>
        <button class="sample" type="button" data-action="pick-sample" data-sample="ep42">
          <span class="num">ep42_pricing.mp4</span><span class="sample__hint">already uploaded</span>
        </button>
        <button class="sample" type="button" data-action="pick-sample" data-sample="ep44">
          <span class="num">ep44_churn.mp4</span><span class="sample__hint">new file</span>
        </button>
      </fieldset>

      <label class="field">
        <span class="field__label">Title</span>
        <input class="input" type="text" name="title" id="upload-title-input" autocomplete="off" required>
      </label>

      <p class="field__error" id="upload-error" hidden></p>

      <footer class="dialog__footer">
        <button class="button" type="button" data-close>Cancel</button>
        <button class="button button--primary" type="submit">Start processing</button>
      </footer>
    </form>
  </dialog>

  <!-- Schedule -->
  <dialog class="dialog" id="schedule-dialog" aria-labelledby="schedule-title">
    <form class="dialog__form" id="schedule-form" novalidate>
      <header class="dialog__header">
        <h2 class="dialog__title" id="schedule-title">Schedule clips</h2>
        <button class="icon-button" type="button" data-close aria-label="Close">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>

      <p class="dialog__lead" id="schedule-summary"></p>

      <fieldset class="checks">
        <legend class="field__label">Post to</legend>
        <label class="check"><input type="checkbox" name="platform" value="TikTok" checked> TikTok</label>
        <label class="check"><input type="checkbox" name="platform" value="Instagram Reels" checked> Instagram Reels</label>
        <label class="check"><input type="checkbox" name="platform" value="YouTube Shorts" checked> YouTube Shorts</label>
        <p class="field__hint">Posts from your connected accounts, @founderstories on all three.</p>
      </fieldset>

      <div class="field-row">
        <label class="field">
          <span class="field__label">First post</span>
          <input class="input" type="datetime-local" name="start" required>
        </label>
        <label class="field">
          <span class="field__label">Spacing</span>
          <select class="input" name="cadence">
            <option value="daily">One per day</option>
            <option value="together">All at once</option>
          </select>
        </label>
      </div>

      <p class="field__error" id="schedule-error" hidden></p>

      <footer class="dialog__footer">
        <button class="button" type="button" data-close>Cancel</button>
        <button class="button button--primary" type="submit">Schedule</button>
      </footer>
    </form>
  </dialog>

  <!-- Edit clip -->
  <dialog class="dialog" id="edit-dialog" aria-labelledby="edit-title">
    <form class="dialog__form" id="edit-form" novalidate>
      <header class="dialog__header">
        <h2 class="dialog__title" id="edit-title">Edit clip</h2>
        <button class="icon-button" type="button" data-close aria-label="Close">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>

      <label class="field">
        <span class="field__label">Title</span>
        <input class="input" type="text" name="title" required>
      </label>
      <label class="field">
        <span class="field__label">Caption</span>
        <input class="input" type="text" name="caption">
      </label>
      <label class="field">
        <span class="field__label">Highlighted word</span>
        <input class="input" type="text" name="highlight" aria-describedby="highlight-hint">
        <span class="field__hint" id="highlight-hint">Must appear in the caption. Leave empty for no highlight.</span>
      </label>

      <p class="field__error" id="edit-error" hidden></p>

      <footer class="dialog__footer">
        <button class="button" type="button" data-close>Cancel</button>
        <button class="button button--primary" type="submit">Save</button>
      </footer>
    </form>
  </dialog>

  <noscript>
    <p class="noscript">This prototype needs JavaScript to run.</p>
  </noscript>
</body>
</html>
